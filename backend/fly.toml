# fly.toml app configuration file generated for gymsync-api on 2026-08-01T16:46:21+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# NOTE: `fly launch` regenerates this file and strips comments. If you re-run it,
# restore these — several settings below look like defaults worth tidying and are
# not. `fly deploy` does not rewrite the file, so normal use is safe.
# backend/tests/test_deploy_config.py asserts the load-bearing ones.

app = 'gymsync-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Gates validate_billing_settings(), which refuses to start a production
  # process that would accept locally-signed Xcode transactions as real
  # purchases. Getting this wrong is free Premium for anyone who asks.
  APP_ENV = 'production'
  # Both signed environments. Order matters only as verification order.
  #
  # Production requires the numeric APPLE_APP_ID (set via `fly secrets`, not
  # here — it's an identifier, but it lives with the other Apple settings).
  # Without it Apple's SignedDataVerifier refuses to construct, which is what
  # crash-looped the first deploy when this key was absent and the config.py
  # default 'Production,Sandbox' applied.
  #
  # Sandbox is what TestFlight builds and sandbox testers produce; Production is
  # what real App Store purchases produce. Both are Apple-signed and safe to
  # accept. Xcode and LocalTesting are NOT — they're unsigned, and the startup
  # check refuses them whenever APP_ENV is production.
  APPLE_ENVIRONMENTS = 'Production,Sandbox'
  # Empty on purpose. The app is native and a React Native fetch sends no Origin
  # header, so an empty allow-list costs it nothing and keeps browsers out.
  CORS_ORIGINS = ''
  # Must match what the Dockerfile baked into the image. Anything else sends the
  # first premium search back to HuggingFace at runtime, silently.
  EMBEDDER = 'nomic'
  FASTEMBED_CACHE_PATH = '/opt/models'
  RERANKER = 'cross_encoder'
  # Fly terminates TLS and appends the real client IP as the LAST
  # X-Forwarded-For hop, which is the hop app/ratelimit.py reads — but only when
  # this is on. Off, every request keys on Fly's proxy address and the entire
  # internet shares one rate-limit bucket.
  TRUSTED_PROXY = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  # 'off' is flyctl's newer spelling of false, and it is deliberate: this process
  # serves live voice WebSockets, and a machine that stops under an idle session
  # drops it mid-sentence. Scale-to-zero would also put a cold start in front of
  # the first request — a bad look during App Review.
  auto_stop_machines = 'off'
  auto_start_machines = true
  # One machine, deliberately. The rate limiter counts in process memory
  # (app/ratelimit.py), so the number of machines IS the multiplier on every
  # signup and login budget. Scaling out needs the shared store in app/cache.py
  # first — the server refuses to boot with REDIS_URL set until that's real.
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 60

  [[http_service.checks]]
    interval = '30s'
    # 10s, not 5s. /health itself is trivial, but it can only answer when the
    # event loop gets a turn — and onnxruntime inference is CPU-bound and holds
    # the GIL, which on a shared CPU starves everything else in bursts. A 5s
    # timeout reported the app unresponsive during a perfectly healthy voice
    # session. Startup now pre-warms the models (see _warm_rag_models), so this
    # is the margin for steady-state contention rather than for a cold load.
    timeout = '10s'
    # Covers the detached model warm-up racing the first few checks.
    grace_period = '45s'
    method = 'GET'
    # Deliberately dependency-free: it reports that the process is alive, not
    # that Supabase is reachable, so a brief Supabase blip can't trigger a
    # restart loop.
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  # 2GB, measured rather than estimated. onnxruntime holds the embedding and
  # reranker models resident once a premium search warms them; the first real
  # search on a 1GB machine was OOM-killed at 871MB RSS while still growing.
  # 256MB (the Fly default) doesn't survive the import, let alone the models.
  #
  # This is the single biggest line on the bill — roughly $11/mo against $6 at
  # 1GB. The way down is to stop serving RAG from inside the API process, not to
  # shave this number; the models are the memory.
  memory = '2gb'
